name: Build & Release APK and IPA

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_title:
        description: 'Release Title (e.g. Astra v1.0.1-beta)'
        required: false
        default: ''
      release_notes:
        description: 'Release Notes / Changelog'
        required: false
        default: 'Automated build from GitHub Actions.'
      is_prerelease:
        description: 'Mark as Beta / Pre-release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Firebase Options & Google Services
        env:
          FIREBASE_OPTIONS_BASE64: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_BASE64 }}
        run: |
          echo "$FIREBASE_OPTIONS_BASE64" | base64 --decode > lib/firebase_options.dart
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "$GOOGLE_SERVICES_BASE64" | base64 --decode > android/app/google-services.json
          fi

      - name: Restore Android Keystore & key.properties
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/astra-release-key.jks
          cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=astra-release-key.jks
          EOF

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        run: |
          flutter build apk --release --split-per-abi

      - name: Prepare APKs with Tag Name
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          # arm64-v8a is for all modern smartphones (~20MB instead of 73MB)
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "Astra-${TAG_NAME}-arm64.apk"
          # Also keep universal fallback if needed
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "Astra-${TAG_NAME}-arm32.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-release-apk
          path: Astra-*.apk

  build-ios:
    name: Build iOS (Unsigned IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Firebase Options
        env:
          FIREBASE_OPTIONS_BASE64: ${{ secrets.FIREBASE_OPTIONS_BASE64 }}
        run: |
          echo "$FIREBASE_OPTIONS_BASE64" | base64 --decode > lib/firebase_options.dart

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS without code signing
        run: flutter build ios --release --no-codesign

      - name: Package Payload to IPA
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v1.0.0}"
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r "Astra-${TAG_NAME}-unsigned.ipa" Payload

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: astra-unsigned-ipa
          path: Astra-*-unsigned.ipa

  publish-release:
    name: Auto Publish GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Determine if Beta / Pre-release
        id: release_type
        run: |
          TAG="${GITHUB_REF_NAME:-}"
          MANUAL_BETA="${{ inputs.is_prerelease }}"
          if [[ "$MANUAL_BETA" == "true" ]] || [[ "$TAG" =~ (beta|alpha|dev|rc) ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "type_label=🧪 Beta / Pre-Release" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
            echo "type_label=✨ Stable Release" >> $GITHUB_OUTPUT
          fi

      - name: Inspect and Prepare Release Assets
        run: |
          mkdir -p release-dist
          find release-assets -type f \( -name "*.apk" -o -name "*.ipa" \) -exec cp {} release-dist/ \;
          echo "Assets ready for release:"
          ls -la release-dist

      - name: Create or Update GitHub Release using GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          TITLE: ${{ inputs.release_title || github.ref_name }}
          IS_PRERELEASE: ${{ steps.release_type.outputs.prerelease }}
          LABEL: ${{ steps.release_type.outputs.type_label }}
          INPUT_RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          chmod +x .github/scripts/publish_release.sh
          .github/scripts/publish_release.sh
